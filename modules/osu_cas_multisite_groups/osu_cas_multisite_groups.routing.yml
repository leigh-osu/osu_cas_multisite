osu_cas_multisite_groups.dashboard:
  path: '/dashboard'
  defaults:
    _controller: 'Drupal\osu_cas_multisite_groups\Controller\DashboardController::build'
    _title: 'My Dashboard'
  requirements:
    _user_is_logged_in: 'TRUE'

# Kept for bookmarks and old links: the dashboard now carries the group list,
# so this route is no longer in the account menu.
osu_cas_multisite_groups.my_groups:
  path: '/user/my-groups'
  defaults:
    _controller: 'Drupal\osu_cas_multisite_groups\Controller\MyGroupsController::build'
    _title: 'My Groups'
  requirements:
    _custom_access: 'Drupal\osu_cas_multisite_groups\Controller\MyGroupsController::access'

# The group's own settings for what may be created in it.
osu_cas_multisite_groups.group_content_settings:
  path: '/group/{group}/content-settings'
  defaults:
    _form: 'Drupal\osu_cas_multisite_groups\Form\GroupSettingsForm'
    _title: 'Content Settings'
  options:
    parameters:
      group:
        type: 'entity:group'
  requirements:
    # Whoever may edit the group decides what it publishes. 'administer all cas
    # groups' covers architects and administrators, who are not members.
    _group_permission: 'edit group'
    _entity_access: 'group.update'
