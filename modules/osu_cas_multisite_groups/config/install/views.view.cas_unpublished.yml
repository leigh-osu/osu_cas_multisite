      header:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          plugin_id: text_custom
          empty: true
          content: '<p>Every unpublished node on the site, newest first. Unpublished content is invisible to visitors but still occupies its alias, so a draft left behind after the migration keeps a path that a published page might otherwise want.</p><p>The Group column says who owns each one — anything showing <em>— no group —</em> is unowned as well as unpublished, and also appears in <a href="/admin/content/orphans">Orphaned content</a>.</p>'
      use_ajax: true
      exposed_form:
        type: basic
        options:
          submit_button: Filter
          reset_button: true
          reset_button_label: Reset
          expose_sorts: false
      query:
        type: views_query
        options:
          disable_sql_rewrite: false
          # Required, not cosmetic. gnode's query alter adds a LEFT JOIN on
          # group_relationship_field_data for access, which yields one row per
          # group a node belongs to: 42 unpublished nodes are in more than one
          # group and the listing reported 650 rows for 549 nodes until this was
          # set. The Orphaned content view needs no such setting because its
          # NOT EXISTS confines it to nodes in no group, where that join can
          # only ever produce a single NULL row.
          distinct: true
