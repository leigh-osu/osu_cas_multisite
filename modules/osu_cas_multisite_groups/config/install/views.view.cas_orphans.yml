          field: area_text_custom
          plugin_id: text_custom
          empty: true
          content: '<p>Content belonging to no group, excluding profiles and publications — those are expected to sit outside the group structure and are not orphans. Everything listed here is unowned: group membership is how content is reached, edited and permissioned, so these appear in no group listing and only architects and administrators can edit them.</p><p>Sort by URL alias to read each one''s history. A path under <code>/be-deleted/</code> or <code>/anrs-old/</code> was parked during the migration and wants deleting rather than assigning. A sectioned path such as <code>/feature/…</code> still indicates where it belongs. A bare single-segment alias like <code>/research-day-2017</code> has no position at all, which usually means nothing links to it.</p>'
