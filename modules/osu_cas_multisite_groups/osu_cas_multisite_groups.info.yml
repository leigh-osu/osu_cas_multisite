name: 'OSU CAS Multisite Groups'
type: module
description: 'Group and domain support for the CAS platform: group-aware breadcrumbs, the group create-content block, views group field/filter, the user dashboard at /dashboard, and the My Groups page.'
package: 'OSU CAS'
core_version_requirement: ^10 || ^11
version: 1.30.0
dependencies:
  - drupal:node
  - drupal:user
  - drupal:views
  - domain:domain
  # Ships field.storage.node.field_domain_source, which the My Content view's
  # domain filter and column depend on.
  - domain:domain_source
  - group:group
  - group_content_menu:group_content_menu
  - osu_cas_multisite:osu_cas_multisite
