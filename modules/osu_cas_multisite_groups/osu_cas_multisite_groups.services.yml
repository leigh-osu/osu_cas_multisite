services:
  # Group builds group.relation_handler.access_control.group_node for us (see
  # GroupServiceProvider) and expects decorators; it even forces shared: false
  # on anything decorating a handler. This one lets the subject of a profile
  # edit it — see ProfileSubjectAccessControl for why a hook cannot.
  osu_cas_multisite_groups.relation_handler.access_control.group_node:
    class: Drupal\osu_cas_multisite_groups\Plugin\Group\RelationHandler\ProfileSubjectAccessControl
    decorates: group.relation_handler.access_control.group_node
    arguments:
      - '@osu_cas_multisite_groups.relation_handler.access_control.group_node.inner'

  osu_cas_multisite_groups.current_group:
    class: Drupal\osu_cas_multisite_groups\CurrentGroup
    arguments:
      - '@current_route_match'
      - '@domain.negotiator'
      - '@config.storage'
      - '@entity_type.manager'
      - '@database'

  # The group context the header menu uses. Group's own context falls back to
  # an arbitrary group membership on routes that have no group; this falls back
  # to the domain's default group instead. Blocks opt in by context_mapping, so
  # nothing else changes.
  osu_cas_multisite_groups.group_display_context:
    class: Drupal\osu_cas_multisite_groups\ContextProvider\GroupDisplayContext
    arguments:
      - '@osu_cas_multisite_groups.current_group'
    tags:
      - { name: context_provider }
  osu_cas_multisite_groups.breadcrumb.group_menu:
    class: Drupal\osu_cas_multisite_groups\Breadcrumb\GroupMenuBreadcrumbBuilder
    arguments:
      - '@entity_type.manager'
      - '@plugin.manager.menu.link'
      - '@database'
    tags:
      # Above easy_breadcrumb (1003) so group content gets the group-aware
      # trail; everything else falls through to easy_breadcrumb.
      - { name: breadcrumb_builder, priority: 1010 }
